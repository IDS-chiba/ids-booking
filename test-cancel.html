<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>決済キャンセル - IDS [TEST]</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;background:#f7f8fc;color:#333;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,0.08);padding:48px 36px;max-width:520px;width:100%;text-align:center}
  .test-banner{background:#ff5722;color:#fff;padding:8px 14px;border-radius:6px;font-weight:bold;font-size:0.85rem;margin-bottom:28px;display:inline-block}
  .x{width:72px;height:72px;border-radius:50%;background:#fff3e0;color:#ff9800;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 22px;font-weight:bold}
  h1{color:#ff9800;font-size:1.5rem;margin-bottom:16px;font-weight:bold}
  p{line-height:1.85;color:#555;font-size:0.97rem}
  .actions{margin-top:34px}
  a.btn{display:inline-block;background:#667eea;color:#fff;padding:12px 26px;border-radius:8px;text-decoration:none;font-size:0.95rem;transition:background 0.2s}
  a.btn:hover{background:#5568d3}
  .footnote{margin-top:28px;font-size:0.82rem;color:#999;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="test-banner">TEST 環境</div>
  <div class="x">!</div>
  <h1>決済をキャンセルしました</h1>
  <p>仮押さえを解除しました。<br>もう一度予約をご希望の場合は、<br>下のボタンから予約カレンダーへお戻りください。</p>
  <div class="actions">
    <a class="btn" href="https://ids-chiba.github.io/ids-booking/">予約カレンダーに戻る</a>
  </div>
  <p class="footnote">お問い合わせ: inohanadancestudio@gmail.com</p>
</div>
</body>
</html>
