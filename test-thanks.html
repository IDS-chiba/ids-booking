<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>決済完了 - IDS [TEST]</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;background:#f7f8fc;color:#333;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border-radius:14px;box-shadow:0 6px 30px rgba(0,0,0,0.08);padding:48px 36px;max-width:520px;width:100%;text-align:center}
  .test-banner{background:#ff5722;color:#fff;padding:8px 14px;border-radius:6px;font-weight:bold;font-size:0.85rem;margin-bottom:28px;display:inline-block}
  .check{width:72px;height:72px;border-radius:50%;background:#e8f5e9;color:#4CAF50;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 22px;font-weight:bold}
  h1{color:#4CAF50;font-size:1.55rem;margin-bottom:16px;font-weight:bold}
  p{line-height:1.85;color:#555;font-size:0.97rem}
  .sid{color:#999;font-size:0.85rem;margin-top:22px;font-family:monospace}
  .actions{margin-top:34px}
  a.btn{display:inline-block;background:#667eea;color:#fff;padding:12px 26px;border-radius:8px;text-decoration:none;font-size:0.95rem;transition:background 0.2s}
  a.btn:hover{background:#5568d3}
  .footnote{margin-top:28px;font-size:0.82rem;color:#999;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="test-banner">TEST 環境</div>
  <div class="check">&#10003;</div>
  <h1>決済が完了しました</h1>
  <p>ご予約ありがとうございます。<br>入室PINコード・利用案内を記載したメールを<br>お送りしましたのでご確認ください。</p>
  <p class="sid" id="sidLabel"></p>
  <div class="actions">
    <a class="btn" href="https://ids-chiba.github.io/ids-booking/">予約カレンダーに戻る</a>
  </div>
  <p class="footnote">メールが届かない場合は、迷惑メールフォルダもご確認ください。<br>お問い合わせ: inohanadancestudio@gmail.com</p>
</div>
<script>
  // SIDをURLから取得して表示
  const params = new URLSearchParams(location.search);
  const sid = params.get('sid') || params.get('SID');
  if (sid) document.getElementById('sidLabel').textContent = '予約番号: ' + sid;
</script>
</body>
</html>
